# Nginx configuration for 15分钟生活圈 deployment
# ─────────────────────────────────────────────────────────────
# Place this file at:
#   /etc/nginx/sites-available/globalreviewops-15min
# and symlink to:
#   /etc/nginx/sites-enabled/globalreviewops-15min
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANT: SSL certificates must be managed separately (e.g., certbot).
# The HTTPS server block below assumes certs at /etc/letsencrypt/live/

server {
    listen 80;
    server_name 15min.globalreviewops.xyz;

    # Redirect all HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name 15min.globalreviewops.xyz;

    # ── SSL ──────────────────────────────────────────────────────────
    # Replace with your actual certificate paths (certbot auto-fills these):
    ssl_certificate     /etc/letsencrypt/live/15min.globalreviewops.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/15min.globalreviewops.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # ── Static Files (city_twin_viewer.html + data files) ───────────
    # Change this to wherever you upload the city_twin_output files:
    root  /var/www/globalreviewops-15min;

    index city_twin_viewer.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Cache static assets (GeoJSON, data files)
    location ~* \.(geojson|json|png|jpg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Serve viewer at root
    location = / {
        try_files /city_twin_viewer.html =404;
    }

    # Also serve viewer at /city_twin_viewer.html
    location = /city_twin_viewer.html {
        try_files /city_twin_viewer.html =404;
        add_header Cache-Control "no-cache";
    }

    # ── API Reverse Proxy → FastAPI :8765 ──────────────────────────
    location /api/ {
        # Increase timeouts for routing computations (isochrones can be slow)
        proxy_connect_timeout  60s;
        proxy_send_timeout     120s;
        proxy_read_timeout     120s;

        # Pass to FastAPI
        proxy_pass http://127.0.0.1:8765/api/;

        # Preserve client IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # FastAPI /docs and /openapi.json
        proxy_pass http://127.0.0.1:8765;
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter 'http://127.0.0.1:8765' 'https://15min.globalreviewops.xyz';
    }

    # Block sensitive paths
    location ~ /\. { deny all; }
}
