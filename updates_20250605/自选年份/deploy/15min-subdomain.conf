# ================================================================
# Nginx 配置 — 子域名 15min.globalreviewops.xyz
# ================================================================
# 用途：独立子域名，不影响母域名 globalreviewops.xyz
# 上传到服务器后重命名为：
#   C:\nginx\conf\sites-available\15min-subdomain.conf
# 然后在主 nginx.conf 的 http {} 块末尾添加一行：
#   include conf/sites-available/15min-subdomain.conf;
# 或创建符号链接到 sites-enabled/（视 Nginx 安装方式而定）
#
# 验证：nginx -t
# 重载：nginx -s reload
# ================================================================

# ── HTTP: 强制跳转到 HTTPS ─────────────────────────────────────
server {
    listen 80;
    server_name 15min.globalreviewops.xyz;

    # 全部跳转 HTTPS
    return 301 https://$host$request_uri;
}

# ── HTTPS: 子域名静态 + API 反代 ─────────────────────────────────
server {
    listen 443 ssl http2;
    server_name 15min.globalreviewops.xyz;

    # ── SSL（certbot 自动填写，certbot --nginx -d 15min.globalreviewops.xyz 会自动生成）────
    #ssl_certificate     C:/Certbot/live/15min.globalreviewops.xyz/fullchain.pem;
    #ssl_certificate_key C:/Certbot/live/15min.globalreviewops.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # ── 字符集 ──────────────────────────────────────────────────
    charset utf-8;

    # ── 静态文件根目录（映射到 C:\www\15min\static\）─────────────
    root  C:/www/15min/static;

    index city_twin_viewer.html;

    # ── 静态资源缓存 ─────────────────────────────────────────────
    location ~* \.(geojson|json|png|jpg|jpeg|gif|woff2|ttf|svg)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # ── HTML 不缓存（方便调试）──────────────────────────────────
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── 主路径 / → city_twin_viewer.html ───────────────────────
    location = / {
        try_files /city_twin_viewer.html =404;
    }

    # ── 允许跨域（API 请求来自浏览器）──────────────────────────────
    location /api/ {
        # API 超时设置（等时圈计算可能很慢，最长 5 分钟）
        proxy_connect_timeout  60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 关键：不带末尾斜杠，完整路径透传到 :8765
        # /api/snap → http://127.0.0.1:8765/api/snap  ✓
        proxy_pass http://127.0.0.1:8765;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 禁止访问隐藏文件 ─────────────────────────────────────────
    location ~ /\. {
        deny all;
    }

    # ── 日志 ────────────────────────────────────────────────────
    error_log  C:/www/15min/logs/nginx_error.log;
    access_log C:/www/15min/logs/nginx_access.log;
}
