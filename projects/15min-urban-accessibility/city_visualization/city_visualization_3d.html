<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南山区 3D 城市可视化 | 步行可达性</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0d1117; color: #e6edf3; overflow: hidden; height: 100vh; }

  #loading {
    position: fixed; inset: 0; background: #0d1117; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .spinner { width: 48px; height: 48px; border: 3px solid #21262d; border-top-color: #58a6ff; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { color: #8b949e; font-size: 14px; margin-top: 8px; max-width: 400px; text-align: center; }
  #loading.hidden { opacity: 0; pointer-events: none; transition: opacity 0.5s; }

  #canvas { position: fixed; inset: 0; }

  /* Header */
  #header {
    position: fixed; top: 0; left: 0; right: 0; height: 52px;
    background: rgba(13,17,23,0.9); backdrop-filter: blur(12px);
    border-bottom: 1px solid #30363d; z-index: 1000;
    display: flex; align-items: center; padding: 0 16px; gap: 12px;
  }
  #header h1 { font-size: 14px; font-weight: 600; background: linear-gradient(90deg, #58a6ff, #a371f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; white-space: nowrap; }
  .hgap { flex: 1; }
  .btn { padding: 4px 10px; border: 1px solid #30363d; border-radius: 5px; background: transparent; color: #8b949e; font-size: 11px; cursor: pointer; transition: all 0.15s; }
  .btn:hover { border-color: #58a6ff; color: #58a6ff; }
  .btn.active { background: #1f6feb; border-color: #1f6feb; color: white; }

  /* Control panel (left) */
  #panel {
    position: fixed; top: 68px; left: 12px; width: 240px;
    background: rgba(22,27,34,0.92); border: 1px solid #30363d; border-radius: 8px;
    backdrop-filter: blur(12px); z-index: 1000; font-size: 12px;
    max-height: calc(100vh - 80px); overflow-y: auto;
  }
  .panel-section { padding: 10px 12px; border-bottom: 1px solid #21262d; }
  .panel-section:last-child { border-bottom: none; }
  .panel-title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #8b949e; margin-bottom: 8px; }

  .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; cursor: pointer; padding: 2px 4px; border-radius: 3px; }
  .legend-item:hover { background: #21262d; }
  .legend-item.disabled { opacity: 0.3; }
  .legend-swatch { width: 14px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* Routing panel */
  #routing-panel {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(22,27,34,0.95); border: 1px solid #30363d; border-radius: 10px;
    backdrop-filter: blur(12px); z-index: 1000; padding: 12px 16px;
    display: flex; align-items: center; gap: 10px; min-width: 480px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  #routing-panel .route-label { font-size: 11px; color: #8b949e; white-space: nowrap; }
  #routing-panel input {
    flex: 1; padding: 6px 10px; border: 1px solid #30363d; border-radius: 5px;
    background: #161b22; color: #e6edf3; font-size: 12px; outline: none;
  }
  #routing-panel input:focus { border-color: #58a6ff; }
  #routing-panel input::placeholder { color: #484f58; }
  #routing-panel .or { color: #484f58; font-size: 11px; }
  #routing-btn { padding: 6px 14px; background: #1f6feb; border: none; border-radius: 5px; color: white; font-size: 12px; cursor: pointer; }
  #routing-btn:hover { background: #388bfd; }
  #routing-btn:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }
  #clear-route-btn { padding: 6px 10px; border: 1px solid #30363d; border-radius: 5px; background: transparent; color: #8b949e; font-size: 12px; cursor: pointer; }
  #clear-route-btn:hover { border-color: #f85149; color: #f85149; }

  /* Route result */
  #route-result {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(22,27,34,0.95); border: 1px solid #30363d; border-radius: 8px;
    backdrop-filter: blur(12px); z-index: 1000; padding: 10px 16px;
    display: none; min-width: 360px; font-size: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  #route-result.show { display: block; }
  #route-result .route-stat { display: flex; justify-content: space-between; padding: 3px 0; }
  #route-result .route-stat .label { color: #8b949e; }
  #route-result .route-stat .value { color: #58a6ff; font-weight: 600; }

  /* Building info */
  #building-info {
    position: fixed; top: 68px; right: 12px; width: 220px;
    background: rgba(22,27,34,0.95); border: 1px solid #30363d; border-radius: 8px;
    backdrop-filter: blur(12px); z-index: 1000; padding: 12px;
    display: none; font-size: 12px;
  }
  #building-info.show { display: block; }
  #building-info h4 { color: #58a6ff; margin-bottom: 8px; font-size: 13px; border-bottom: 1px solid #30363d; padding-bottom: 6px; }
  #building-info .info-row { display: flex; justify-content: space-between; padding: 2px 0; }
  #building-info .info-row .label { color: #8b949e; }
  #building-info .info-row .val { color: #e6edf3; }

  /* Legend gradient bar */
  .gradient-bar { display: flex; align-items: center; gap: 6px; }
  .gradient-bar span { font-size: 10px; color: #8b949e; }
  .gradient-bar .bar { flex: 1; height: 6px; background: linear-gradient(90deg, #f85149, #d29922, #56d364); border-radius: 3px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p id="loading-text">初始化 Three.js 场景...</p>
</div>

<canvas id="canvas"></canvas>

<div id="header">
  <h1>南山区 3D 城市可视化</h1>
  <div class="hgap"></div>
  <button class="btn active" id="btn-sat">卫星</button>
  <button class="btn" id="btn-dark">深色</button>
  <div style="width:1px;height:20px;background:#30363d;margin:0 4px;"></div>
  <button class="btn active" id="btn-buildings">建筑</button>
  <button class="btn active" id="btn-roads">道路</button>
  <button class="btn" id="btn-nodes">节点</button>
  <button class="btn" id="btn-panoramas">全景点</button>
</div>

<div id="panel">
  <div class="panel-section">
    <div class="panel-title">建筑用途类型</div>
    <div id="use-legend"></div>
  </div>
  <div class="panel-section">
    <div class="panel-title">步行可达性评分</div>
    <div class="gradient-bar" style="margin-bottom:6px;">
      <span>差</span><div class="bar"></div><span>好</span>
    </div>
    <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:11px;color:#8b949e;">
      <input type="checkbox" id="color-by-walkability" checked style="accent-color:#58a6ff;">
      按可达性着色
    </label>
  </div>
  <div class="panel-section">
    <div class="panel-title">道路类型</div>
    <div id="road-legend"></div>
  </div>
  <div class="panel-section">
    <div class="panel-title">统计信息</div>
    <div id="stats-info"></div>
  </div>
</div>

<div id="building-info">
  <h4 id="b-name">-</h4>
  <div class="info-row"><span class="label">用途</span><span class="val" id="b-use">-</span></div>
  <div class="info-row"><span class="label">层数</span><span class="val" id="b-floors">-</span></div>
  <div class="info-row"><span class="label">高度</span><span class="val" id="b-height">-</span></div>
  <div class="info-row"><span class="label">可达性</span><span class="val" id="b-walk">-</span></div>
  <div class="info-row"><span class="label">地址</span><span class="val" id="b-addr">-</span></div>
</div>

<div id="routing-panel">
  <span class="route-label">起点</span>
  <input id="start-input" placeholder="点击地图选择或输入名称..." />
  <span class="route-label" style="margin-left:4px;">终点</span>
  <input id="end-input" placeholder="点击地图选择或输入名称..." />
  <button id="routing-btn">路线规划</button>
  <button id="clear-route-btn">清除</button>
</div>

<div id="route-result">
  <div class="route-stat"><span class="label">距离</span><span class="value" id="r-dist">-</span></div>
  <div class="route-stat"><span class="label">预计步行时间</span><span class="value" id="r-time">-</span></div>
  <div class="route-stat"><span class="label">道路类型</span><span class="value" id="r-types">-</span></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ================================================================
// 全局状态
// ================================================================
let scene, camera, renderer, controls;
let buildingMeshes = [], roadMeshes = [], nodeMarkers = [], panoramaMarkers = [];
let buildingGroup, roadGroup, nodeGroup, panoramaGroup;
let routeMarkers = [];
let routeLine = null;
let selectedBuilding = null;

const USE_COLORS = {
  1: 0x78b4dc, 2: 0xffc850, 3: 0xc864dc,
  4: 0xb46450, 5: 0x50a064, 6: 0xdc5050,
  7: 0xdc963c, 8: 0x64c8dc, 9: 0xb4b4b4,
};
const USE_NAMES = {1:'住宅',2:'商业',3:'办公',4:'工业',5:'文体',6:'医疗',7:'文化',8:'科教',9:'其他'};
const ROAD_COLORS = {
  primary:'#ffcc44', secondary:'#ffeebb', tertiary:'#ffffcc',
  residential:'#f5f5f5', footway:'#b0c0a0', service:'#e0e0e0',
  pedestrian:'#d0d0b0', steps:'#a0a0c0', path:'#c0c0a0',
  unclassified:'#d8d8d8', default:'#c8c8c8'
};
const ROAD_WEIGHTS = {
  primary:4, trunk:5, secondary:3, tertiary:2, residential:1.5,
  footway:1, service:1, pedestrian:1, steps:0.8, default:1.5
};
const LAYER_VIS = { buildings:true, roads:true, nodes:false, panoramas:false };

// 路径规划数据 (从 routing_graph.json 加载)
let routingGraph = null;
let nodeCoords = null;
let routeStart = null; // {id, name, lon, lat}
let routeEnd = null;

// ================================================================
// Three.js 初始化
// ================================================================
function initThree() {
  const canvas = document.getElementById('canvas');
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d1117);

  // 相机 (俯视南山区中心)
  camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2000);
  camera.position.set(0, 600, 800);

  controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.minDistance = 50;
  controls.maxDistance = 3000;
  controls.maxPolarAngle = Math.PI / 2.1;

  // 光照
  const ambient = new THREE.AmbientLight(0x8899aa, 0.6);
  scene.add(ambient);
  const sun = new THREE.DirectionalLight(0xfff5e0, 1.2);
  sun.position.set(200, 500, 300);
  sun.castShadow = true;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 2000;
  sun.shadow.camera.left = -1000;
  sun.shadow.camera.right = 1000;
  sun.shadow.camera.top = 1000;
  sun.shadow.camera.bottom = -1000;
  sun.shadow.mapSize.set(2048, 2048);
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0x88aacc, 0.3);
  fill.position.set(-100, 200, -200);
  scene.add(fill);

  // 地面
  const groundGeo = new THREE.PlaneGeometry(3000, 3000);
  const groundMat = new THREE.MeshLambertMaterial({ color: 0x1a2030 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -1;
  ground.receiveShadow = true;
  scene.add(ground);

  // 组
  buildingGroup = new THREE.Group();
  roadGroup = new THREE.Group();
  nodeGroup = new THREE.Group();
  panoramaGroup = new THREE.Group();
  scene.add(buildingGroup, roadGroup, nodeGroup, panoramaGroup);

  window.addEventListener('resize', onResize);
  animate();
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

// ================================================================
// 坐标转换: lon/lat → Three.js 局部坐标
// ================================================================
const CENTER_LON = 113.94;
const CENTER_LAT = 22.53;
const SCALE = 800; // 经纬度1度 ≈ 800 单位

function lonLatToXYZ(lon, lat) {
  const x = (lon - CENTER_LON) * SCALE;
  const z = -(lat - CENTER_LAT) * SCALE;
  return { x, y: 0, z };
}

// ================================================================
// 加载 GeoJSON 数据
// ================================================================
async function loadAll() {
  updateLoading('加载建筑数据...');
  await loadBuildings();
  updateLoading('加载道路网络...');
  await loadRoads();
  updateLoading('加载交叉口节点...');
  await loadNodes();
  updateLoading('加载路径规划图...');
  await loadRoutingGraph();
  updateLoading('加载完成!');
  setTimeout(() => document.getElementById('loading').classList.add('hidden'), 500);
}

function updateLoading(text) {
  document.getElementById('loading-text').textContent = text;
}

// 建筑层
async function loadBuildings() {
  const res = await fetch('city_cesium.geojson');
  const data = await res.json();
  const buildings = data.features.filter(f => f.geometry.type === 'Polygon');

  // 统计
  document.getElementById('stats-info').innerHTML =
    `<div style="color:#8b949e;margin-bottom:6px;">建筑总数: <span style="color:#58a6ff">${buildings.length}</span></div>`;

  // 图例
  const types = [...new Set(buildings.map(b => b.properties.use_type))];
  const legend = document.getElementById('use-legend');
  legend.innerHTML = types.map(t => {
    const c = USE_COLORS[t] || USE_COLORS[9];
    const hex = '#' + c.toString(16).padStart(6,'0');
    const name = USE_NAMES[t] || '其他';
    return `<div class="legend-item" data-ut="${t}">
      <div class="legend-swatch" style="background:${hex}"></div>
      <span>${name}</span>
    </div>`;
  }).join('');

  legend.querySelectorAll('.legend-item').forEach(item => {
    item.addEventListener('click', () => {
      item.classList.toggle('disabled');
      const ut = parseInt(item.dataset.ut);
      const disabled = item.classList.contains('disabled');
      buildingMeshes.forEach(m => {
        if (m.userData.useType === ut) m.visible = !disabled;
      });
    });
  });

  // 体素建筑
  buildings.forEach((f, i) => {
    const p = f.properties;
    const coords = f.geometry.coordinates[0];
    if (!coords || coords.length < 3) return;

    const lon = coords.reduce((s, c) => s + c[0], 0) / coords.length;
    const lat = coords.reduce((s, c) => s + c[1], 0) / coords.length;
    const { x, z } = lonLatToXYZ(lon, lat);

    const height = (p.height_m || 15);
    const floors = p.floors || 3;
    const ut = p.use_type || 9;
    const color = p.walkability != null && document.getElementById('color-by-walkability').checked
      ? walkabilityToColor(p.walkability)
      : USE_COLORS[ut] || USE_COLORS[9];

    // 根据楼栋范围估算宽度
    const lons = coords.map(c => c[0]);
    const lats = coords.map(c => c[1]);
    const lonSpan = (Math.max(...lons) - Math.min(...lons)) * SCALE;
    const latSpan = (Math.max(...lats) - Math.min(...lats)) * SCALE;
    const w = Math.max(lonSpan, latSpan, 5);

    const geo = new THREE.BoxGeometry(Math.max(w, 5), Math.max(height, 3), Math.max(w, 5));
    const mat = new THREE.MeshLambertMaterial({
      color,
      transparent: true,
      opacity: p.walkability != null ? 0.82 : 0.7,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, height / 2, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.userData = { fclass:'building', useType: ut, floors, height_m: height,
      walkability: p.walkability, name: p.name || p.address || '未知建筑',
      use_name: p.use_name || USE_NAMES[ut] || '其他', address: p.address || '' };
    buildingGroup.add(mesh);
    buildingMeshes.push(mesh);
  });

  document.getElementById('btn-buildings').addEventListener('click', function() {
    this.classList.toggle('active');
    buildingGroup.visible = this.classList.contains('active');
    LAYER_VIS.buildings = this.classList.contains('active');
  });

  document.getElementById('color-by-walkability').addEventListener('change', (e) => {
    buildingMeshes.forEach(m => {
      if (m.userData.walkability != null) {
        m.material.color.setHex(walkabilityToColor(m.userData.walkability));
      }
    });
  });

  // 点击选中
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  document.getElementById('canvas').addEventListener('click', (e) => {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(buildingMeshes);
    if (hits.length > 0) {
      const b = hits[0].object;
      showBuildingInfo(b.userData);
      cameraFlyTo(b.position.x, b.position.y + 20, b.position.z, 150);
    }
  });
}

function showBuildingInfo(d) {
  const panel = document.getElementById('building-info');
  panel.classList.add('show');
  document.getElementById('b-name').textContent = d.name;
  document.getElementById('b-use').textContent = d.use_name;
  document.getElementById('b-floors').textContent = d.floors + ' 层';
  document.getElementById('b-height').textContent = d.height_m.toFixed(1) + ' m';
  document.getElementById('b-addr').textContent = d.address || '-';
  const w = d.walkability;
  document.getElementById('b-walk').textContent = w != null ? w.toFixed(1) + ' / 10' : '无数据';
}

function cameraFlyTo(x, y, z, dist) {
  const target = new THREE.Vector3(x, y, z);
  const start = camera.position.clone();
  let t = 0;
  const duration = 60; // frames
  function step() {
    t++;
    const f = Math.min(t / duration, 1);
    const ease = 1 - Math.pow(1 - f, 3);
    camera.position.lerpVectors(start, new THREE.Vector3(x, y + dist, z + dist * 0.3), ease);
    controls.target.lerp(target, ease * 0.1);
    if (t < duration) requestAnimationFrame(step);
  }
  step();
}

function walkabilityToColor(w) {
  w = Math.max(0, Math.min(10, w || 5));
  const t = w / 10;
  if (t < 0.4) return 0xff4d2a; // red-ish
  if (t < 0.7) return 0xd29922;  // yellow-ish
  return 0x2acd45;               // green-ish
}

// 道路层
async function loadRoads() {
  try {
    const res = await fetch('connected_roads.geojson');
    const data = await res.json();
    const roads = data.features;

    // 道路图例
    const roadTypes = [...new Set(roads.map(r => r.properties.fclass_en))].slice(0, 10);
    const legend = document.getElementById('road-legend');
    legend.innerHTML = roadTypes.map(rt => {
      const color = ROAD_COLORS[rt] || ROAD_COLORS.default;
      const w = ROAD_WEIGHTS[rt] || ROAD_WEIGHTS.default;
      return `<div class="legend-item">
        <div style="width:16px;height:${w * 1.5}px;background:${color};border-radius:1px;flex-shrink:0;"></div>
        <span>${rt || '其它'}</span>
      </div>`;
    }).join('');

    roads.forEach(f => {
      const p = f.properties;
      const coords = f.geometry.coordinates;
      if (!coords || coords.length < 2) return;

      const points = coords.map(c => {
        const { x, z } = lonLatToXYZ(c[0], c[1]);
        return new THREE.Vector3(x, 0.2, z);
      });
      const geo = new THREE.BufferGeometry().setFromPoints(points);
      const w = p.weight || 1.5;
      const color = new THREE.Color(p.color || '#c8c8c8');
      const mat = new THREE.LineBasicMaterial({ color, linewidth: Math.max(w, 1) });
      const line = new THREE.Line(geo, mat);
      line.userData = { fclass: 'road', fclass_en: p.fclass_en, walkable: p.walkable };
      roadGroup.add(line);
      roadMeshes.push(line);
    });
  } catch(e) { console.warn('道路加载失败:', e); }

  document.getElementById('btn-roads').addEventListener('click', function() {
    this.classList.toggle('active');
    roadGroup.visible = this.classList.contains('active');
    LAYER_VIS.roads = this.classList.contains('active');
  });
}

// 节点层
async function loadNodes() {
  try {
    const res = await fetch('network_nodes.geojson');
    const data = await res.json();
    const nodes = data.features;

    nodes.forEach(f => {
      const [lon, lat] = f.geometry.coordinates;
      const { x, z } = lonLatToXYZ(lon, lat);
      const isJunction = f.properties.is_junction;

      const r = isJunction ? 2 : 1;
      const geo = new THREE.CircleGeometry(r, 6);
      const mat = new THREE.MeshBasicMaterial({
        color: isJunction ? 0xff8844 : 0x4488ff,
        transparent: true, opacity: 0.6
      });
      const marker = new THREE.Mesh(geo, mat);
      marker.position.set(x, 0.5, z);
      marker.rotation.x = -Math.PI / 2;
      marker.userData = { nodeId: f.properties.node_id, degree: f.properties.degree };
      nodeGroup.add(marker);
      nodeMarkers.push(marker);
    });
  } catch(e) { console.warn('节点加载失败:', e); }

  document.getElementById('btn-nodes').addEventListener('click', function() {
    this.classList.toggle('active');
    nodeGroup.visible = this.classList.contains('active');
    LAYER_VIS.nodes = this.classList.contains('active');
  });
}

// 路径规划图
async function loadRoutingGraph() {
  try {
    const res = await fetch('routing_graph.json');
    routingGraph = await res.json();
    nodeCoords = routingGraph.nodes;
    updateLoading('路径规划就绪!');
  } catch(e) { console.warn('路由图加载失败:', e); }
}

// ================================================================
// Dijkstra 路径规划 (前端 JS 实现)
// ================================================================
function dijkstra(startId, endId) {
  if (!routingGraph || !routingGraph.adjacency[startId] || !routingGraph.adjacency[endId]) {
    return null;
  }

  const adj = routingGraph.adjacency;
  const dist = {};
  const prev = {};
  const pq = [];
  const visited = new Set();

  dist[startId] = 0;
  pq.push([0, startId]);

  while (pq.length > 0) {
    pq.sort((a, b) => a[0] - b[0]);
    const [d, u] = pq.shift();
    if (visited.has(u)) continue;
    visited.add(u);
    if (u === endId) break;

    const neighbors = adj[u] || {};
    for (const [v, edge] of Object.entries(neighbors)) {
      if (visited.has(parseInt(v))) continue;
      const nd = d + edge.time;
      if (dist[v] === undefined || nd < dist[v]) {
        dist[v] = nd;
        prev[v] = u;
        pq.push([nd, parseInt(v)]);
      }
    }
  }

  if (dist[endId] === undefined) return null;

  // 回溯
  const path = [];
  let cur = endId;
  while (cur !== undefined) {
    path.unshift(cur);
    cur = prev[cur];
  }
  return { path, dist: dist[endId] };
}

function findNearestNode(lon, lat) {
  if (!nodeCoords) return null;
  let best = null, bestDist = Infinity;
  for (const [nid, nc] of Object.entries(nodeCoords)) {
    const d = Math.hypot(nc.lon - lon, nc.lat - lat);
    if (d < bestDist) { bestDist = d; best = { id: parseInt(nid), lon: nc.lon, lat: nc.lat }; }
  }
  return best;
}

// ================================================================
// 路径规划交互
// ================================================================
let mapClickMode = null; // 'start' | 'end'

document.getElementById('canvas').addEventListener('dblclick', (e) => {
  if (!nodeCoords) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const mx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  const my = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(mx, my), camera);

  // 在地面 plane 交点
  const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const target = new THREE.Vector3();
  raycaster.ray.intersectPlane(groundPlane, target);
  if (!target) return;

  const lon = target.x / SCALE + CENTER_LON;
  const lat = -(target.z / SCALE) + CENTER_LAT;
  const node = findNearestNode(lon, lat);
  if (!node) return;

  if (mapClickMode === 'start') {
    document.getElementById('start-input').value = `节点 #${node.id}`;
    routeStart = node;
  } else if (mapClickMode === 'end') {
    document.getElementById('end-input').value = `节点 #${node.id}`;
    routeEnd = node;
  }
  mapClickMode = null;
  document.getElementById('routing-panel').style.borderColor = '#30363d';
});

['start-input', 'end-input'].forEach((id, idx) => {
  const inp = document.getElementById(id);
  inp.addEventListener('focus', () => {
    mapClickMode = idx === 0 ? 'start' : 'end';
    document.getElementById('routing-panel').style.borderColor = '#1f6feb';
    document.getElementById('routing-panel').title = '请双击地图选择位置';
  });
  inp.addEventListener('blur', () => {
    setTimeout(() => { if (mapClickMode) { mapClickMode = null; document.getElementById('routing-panel').style.borderColor = '#30363d'; } }, 200);
  });
});

document.getElementById('routing-btn').addEventListener('click', () => {
  if (!routeStart || !routeEnd) {
    alert('请先设置起点和终点（通过双击地图选择）');
    return;
  }
  clearRoute();
  computeAndDrawRoute();
});

document.getElementById('clear-route-btn').addEventListener('click', clearRoute);

function computeAndDrawRoute() {
  const t0 = performance.now();
  const result = dijkstra(routeStart.id, routeEnd.id);
  console.log(`Dijkstra 耗时: ${(performance.now()-t0).toFixed(0)}ms`);

  if (!result) {
    alert('未找到可行路径');
    return;
  }

  const { path, dist } = result;
  const timeMin = dist;

  // 绘制路线
  const pts = path.map(nid => {
    const nc = nodeCoords[nid];
    const { x, z } = lonLatToXYZ(nc.lon, nc.lat);
    return new THREE.Vector3(x, 1.5, z);
  });

  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({ color: 0x58a6ff, linewidth: 3 });
  routeLine = new THREE.Line(geo, mat);
  scene.add(routeLine);

  // 起点/终点标记
  addRouteMarker(routeStart, 0x2acd45, '起点');
  addRouteMarker(routeEnd, 0xf85149, '终点');

  // 结果面板
  document.getElementById('r-dist').textContent = `${(dist * 83.33 / 1000).toFixed(2)} km`;
  document.getElementById('r-time').textContent = `${timeMin.toFixed(1)} 分钟`;
  document.getElementById('r-types').textContent = path.length > 2 ? `${path.length} 段` : '-';
  document.getElementById('route-result').classList.add('show');

  // 飞向路径中点
  const midIdx = Math.floor(path.length / 2);
  const midNode = nodeCoords[path[midIdx]];
  const { x: mx, z: mz } = lonLatToXYZ(midNode.lon, midNode.lat);
  cameraFlyTo(mx, 100, mz, 300);
}

function addRouteMarker(node, color, label) {
  const { x, z } = lonLatToXYZ(node.lon, node.lat);
  // 圆柱标记
  const geo = new THREE.CylinderGeometry(6, 6, 4, 16);
  const mat = new THREE.MeshLambertMaterial({ color });
  const marker = new THREE.Mesh(geo, mat);
  marker.position.set(x, 2, z);
  marker.castShadow = true;
  scene.add(marker);
  routeMarkers.push(marker);

  // 光晕
  const ringGeo = new THREE.RingGeometry(7, 9, 32);
  const ringMat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.set(x, 0.3, z);
  ring.rotation.x = -Math.PI / 2;
  scene.add(ring);
  routeMarkers.push(ring);
}

function clearRoute() {
  if (routeLine) { scene.remove(routeLine); routeLine = null; }
  routeMarkers.forEach(m => scene.remove(m));
  routeMarkers = [];
  document.getElementById('route-result').classList.remove('show');
  routeStart = null; routeEnd = null;
  document.getElementById('start-input').value = '';
  document.getElementById('end-input').value = '';
}

    b.classList.remove('active');
  });

});
