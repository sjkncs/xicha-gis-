<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南山区3D数字孪生 - CesiumJS</title>
<style>
/* Cesium overrides */
.cesium-viewer-bottom,.cesium-viewer-toolbar,.cesium-viewer-animationContainer,
.cesium-viewer-timelineContainer,.cesium-viewer-fullscreenButton,.cesium-viewer-vrContainer,
.cesium-widget-credits{display:none!important}

/* SVG icons */
.icon-svg{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:4px}

/* Color scheme */
:root{
  --primary:#3B82F6;--primary-dark:#2563EB;--primary-light:#93C5FD;
  --bg-base:#0F172A;--bg-panel:#1E293B;--bg-card:#334155;
  --bg-hover:#475569;--text-primary:#F8FAFC;--text-secondary:#94A3B8;
  --text-muted:#64748B;--border:#334155
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Inter","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg-base);color:var(--text-primary);
  height:100vh;display:flex;flex-direction:column;overflow:hidden
}

/* Header */
#header{
  background:linear-gradient(135deg,#161b22,#1c2128);
  border-bottom:1px solid var(--border);padding:10px 20px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;z-index:1000;backdrop-filter:blur(8px)
}
#header h1{font-size:15px;font-weight:600;
  background:linear-gradient(90deg,#58a6ff,#a371f7);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
#stats-bar{font-size:11px;color:var(--text-secondary);margin-left:12px}

/* Buttons */
.ctrl-btn{
  padding:5px 12px;border:1px solid var(--border);border-radius:6px;
  background:transparent;color:var(--text-secondary);font-size:11px;
  cursor:pointer;transition:all .2s;font-family:inherit
}
.ctrl-btn:hover{border-color:var(--primary);color:var(--primary)}
.ctrl-btn.active{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff}
.ctrl-btn-sm{
  padding:4px 10px;background:var(--bg-card);color:var(--text-secondary);
  border:1px solid var(--border);border-radius:6px;font-size:11px;
  cursor:pointer;transition:all .15s;white-space:nowrap
}
.ctrl-btn-sm.active{background:rgba(59,130,246,.2);color:var(--primary-light);border-color:var(--primary);font-weight:600}
.ctrl-btn-sm:hover{border-color:var(--primary);color:var(--text-primary)}
.btn-group{display:flex;gap:4px;align-items:center}

/* Spinner */
.spinner-sm{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Layout */
#main{display:flex;flex:1;overflow:hidden}
#sidebar{width:300px;background:var(--bg-panel);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column}
#cesiumContainer{flex:1;position:relative}

/* Scrollbars */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg-base)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* Sections */
.section{border-bottom:1px solid #21262d;padding:12px}
.section-title{
  font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;
  color:var(--text-secondary);margin-bottom:10px;display:flex;align-items:center;gap:6px
}

/* Layer rows */
.layer-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:12px}
.layer-row .layer-name{display:flex;align-items:center;gap:6px;color:var(--text-secondary)}
.layer-indicator{font-size:9px;padding:2px 6px;border-radius:4px;background:var(--bg-card);color:var(--primary-light);margin-left:6px;font-weight:600}

/* Toggle switch */
.toggle-switch{position:relative;width:34px;height:18px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:10px;cursor:pointer;transition:.2s}
.toggle-slider:before{content:'';position:absolute;width:14px;height:14px;left:2px;bottom:2px;background:#fff;border-radius:50%;transition:.2s}
.toggle-switch input:checked+.toggle-slider{background:var(--primary)}
.toggle-switch input:checked+.toggle-slider:before{transform:translateX(16px)}

/* Legend */
.legend-item{display:flex;align-items:center;gap:8px;padding:3px 6px;border-radius:6px;cursor:pointer;font-size:11px;transition:background .15s}
.legend-item:hover{background:var(--bg-card)}
.legend-color{width:12px;height:12px;border-radius:3px;flex-shrink:0}

/* Info card */
.info-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
.info-row{display:flex;justify-content:space-between;font-size:11px;color:var(--text-secondary);margin-bottom:4px}
.info-row span{color:var(--text-primary)}

/* Slider */
.slider-row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:12px}
.slider-label{color:var(--text-secondary);min-width:90px;font-size:11px}
.slider-value{color:var(--primary-light);min-width:40px;font-size:11px;font-weight:600}
input[type=range]{-webkit-appearance:none;flex:1;height:4px;background:var(--border);border-radius:2px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--primary);border-radius:50%;cursor:pointer}
input[type=range]::-moz-range-thumb{width:14px;height:14px;background:var(--primary);border-radius:50%;cursor:pointer;border:none}

/* Loading overlay */
#loading{position:fixed;inset:0;background:var(--bg-base);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:16px}
#loading.hidden{display:none}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
#loading p{font-size:14px;color:var(--text-secondary)}
#loading .sub{font-size:12px;color:var(--text-muted)}

/* Search */
.search-box{position:relative;margin-bottom:8px}
.search-box input{width:100%;padding:7px 30px 7px 8px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-size:12px;box-sizing:border-box;outline:none;transition:border-color .2s}
.search-box input:focus{border-color:var(--primary)}
.search-box input::placeholder{color:var(--text-muted)}
.search-box button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-secondary);font-size:12px;padding:2px}
.search-results{position:absolute;top:100%;left:0;right:0;background:var(--bg-panel);border:1px solid var(--border);border-radius:6px;z-index:1000;max-height:200px;overflow-y:auto;display:none}
.search-result-item{padding:8px;font-size:11px;cursor:pointer;border-bottom:1px solid #21262d;color:var(--text-primary)}
.search-result-item:hover{background:var(--bg-card)}
.search-result-item:last-child{border-bottom:none}
.sr-name{font-size:12px}
.sr-sub{font-size:10px;color:var(--text-muted);margin-top:2px}

/* LC result */
.lc-time-btns{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.lc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.lc-stat{background:var(--bg-base);border-radius:6px;padding:6px;text-align:center}
.lcs-val{font-size:16px;font-weight:700;color:var(--primary-light)}
.lcs-label{font-size:9px;color:var(--text-muted);margin-top:2px}
.result-card{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px}
.result-title{font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.section-loading{text-align:center;padding:8px;font-size:11px;color:var(--text-muted)}
.section-loading.hidden{display:none}
.facility-list{max-height:240px;overflow-y:auto;margin-top:8px}
.facility-item{padding:5px 0;border-bottom:1px solid #21262d;font-size:11px;display:flex;justify-content:space-between;align-items:center}
.facility-item:last-child{border-bottom:none}
.facility-name{color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.facility-time{color:var(--primary-light);font-weight:600;flex-shrink:0;margin-left:6px}

/* Camera hint */
#camera-hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.85);border:1px solid var(--border);border-radius:20px;padding:6px 16px;font-size:11px;color:var(--text-secondary);z-index:100;pointer-events:none;backdrop-filter:blur(6px);transition:opacity .5s}
#camera-hint.hidden{opacity:0}
</style>
</head>
<body>

</symbol>
</defs>
</svg>

<!-- Loading -->
<div id="loading">
  <div class="spinner"></div>
  <p>加载3D城市数字孪生...</p>
  <p class="sub" id="loading-sub">正在获取地形数据</p>
</div>

<!-- Header -->
<div id="header">
  <div style="display:flex;align-items:center;flex:1;gap:12px;">
    <h1>南山区3D城市数字孪生</h1>
    <span id="stats-bar">初始化中...</span>
    <div style="display:flex;align-items:center;gap:6px;margin-left:auto;">
      <div class="search-box" style="margin:0;">
        <input type="text" id="lc-search" placeholder="搜索地址...">
        <button onclick="lcSearchLocation()">&#128269;</button>
        <div class="search-results" id="lc-search-results"></div>
      </div>
    </div>
  </div>
  <div class="btn-group">
    <button class="ctrl-btn active" onclick="setTerrain('cesium')">Cesium地形</button>
    <button class="ctrl-btn" onclick="setTerrain('flat')">平坦地形</button>
    <button class="ctrl-btn" onclick="flyToNS()">南山区视角</button>
    <button class="ctrl-btn" onclick="reloadTwinData(true)" title="重新加载最新建筑、道路与元数据">刷新模型数据</button>
    <button class="ctrl-btn" onclick="window.location.href='city_twin_viewer.html'" title="切换2D视图">切换2D视图</button>
  </div>
</div>

<div id="main">
  <!-- Sidebar -->
  <div id="sidebar">
    <!-- Data Layers -->
    <div class="section">
      <div class="section-title"><svg style="width:12px;height:12px;flex-shrink:0;color:var(--primary-light)"><use href="#ico-layer"/></svg> 数据层</div>
      <div class="layer-row">
        <span class="layer-name">
          <svg style="width:12px;height:12px;color:#58a6ff"><use href="#ico-building"/></svg>
          建筑物<span class="layer-indicator" id="ind-buildings">-</span>
        </span>
        <label class="toggle-switch">
          <input type="checkbox" id="toggle-buildings" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="layer-row">
        <span class="layer-name">
          <svg style="width:12px;height:12px;color:#ffd60a"><use href="#ico-road"/></svg>
          道路网络<span class="layer-indicator" id="ind-roads">-</span>
        </span>
        <label class="toggle-switch">
          <input type="checkbox" id="toggle-roads" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <!-- 3D Controls -->
    <div class="section">
      <div class="section-title"><svg style="width:12px;height:12px;flex-shrink:0;color:var(--primary-light)"><use href="#ico-3d"/></svg> 3D 控制</div>
      <div class="slider-row">
        <span class="slider-label">建筑高度倍数</span>
        <input type="range" id="height-mult" min="1" max="10" step="0.5" value="1">
        <span class="slider-value" id="height-val">1.0x</span>
      </div>
      <div class="slider-row">
        <span class="slider-label">建筑透明度</span>
        <input type="range" id="alpha-slider" min="0.1" max="1.0" step="0.05" value="0.96">
        <span class="slider-value" id="alpha-val">0.96</span>
      </div>
      <div class="slider-row">
        <span class="slider-label">道路宽度</span>
        <input type="range" id="road-width" min="1" max="8" step="0.5" value="3">
        <span class="slider-value" id="road-val">3</span>
      </div>
      <div style="padding:6px 0 0;font-size:11px;color:var(--text-muted);">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
          <input type="checkbox" id="toggle-wireframe" style="accent-color:var(--primary)">
          <span>显示建筑边框</span>
        </label>
      </div>
    </div>

    <!-- Building Legend -->
    <div class="section">
      <div class="section-title"><svg style="width:12px;height:12px;flex-shrink:0;color:var(--primary-light)"><use href="#ico-building"/></svg> 建筑用途</div>
      <div id="legend-use"></div>
    </div>

    <!-- Road Legend -->
    <div class="section">
      <div class="section-title"><svg style="width:12px;height:12px;flex-shrink:0;color:var(--primary-light)"><use href="#ico-road"/></svg> 道路类型</div>
      <div id="legend-roads"></div>
    </div>

    <!-- 15分钟生活圈 -->
    <div class="section">
      <div class="section-title">
        <svg style="width:12px;height:12px;flex-shrink:0;color:var(--primary-light)"><use href="#ico-location"/></svg>
        15分钟生活圈分析
      </div>
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;">
        点击地图任意位置，分析步行可达范围内的生活便利性
      </div>
      <div class="lc-time-btns">
        <button class="ctrl-btn-sm" id="lc-btn-10" onclick="setLCRadius(10)">10分钟</button>

        <div style="margin-top:4px;">分析中...</div>
      </div>

      </div>

        <div style="font-size:11px;color:var(--text-muted);text-align:center;padding:8px;">点击3D建筑查看详情</div>
      </div>

  <!-- Cesium Container -->
  <div id="cesiumContainer"></div>

<!-- Camera hint -->

<!-- CesiumJS -->
<link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>

<script>
(function() {
  'use strict';

  /* ═══════════════════════════════════════════════════════
     Constants & Color Maps
     ═══════════════════════════════════════════════════════ */
  const USE_NAMES_3D = {0:'居住',1:'商业',2:'办公',3:'医疗',4:'工业',5:'工业',6:'绿地',7:'商务',8:'教育'};

  // Pre-build Cesium.Color objects
  function c(hex) { return Cesium.Color.fromCssColorString(hex); }

  // use_type: 1=居住(灰蓝), 2=商业(深灰), 3=办公(蓝紫), 4=医疗(深红),
  //            5=工业(深黄), 6=仓储(棕), 7=绿地(深绿), 8=商务(深橙), 9=教育(深青)
  const USE_COLORS = [
    c('#4a7fa8'), c('#6e6e6e'), c('#8b4db0'), c('#b83030'),
    c('#c8960a'), c('#7a3a2a'), c('#2d7a42'), c('#b86018'), c('#2a8fa8')
  ];

  const ROAD_COLORS = {
    motorway:      c('#FFD700'), trunk:         c('#FFA500'),
    primary:       c('#FF8C00'), secondary:     c('#FFB347'),
    tertiary:      c('#DEB887'), residential:   c('#B0C4DE'),
    unclassified:  c('#A9A9A9'), service:      c('#808080'),
    footway:       c('#98FB98'), path:         c('#90EE90'),
    cycleway:      c('#00CED1'), pedestrian:    c('#ADFF2F'),
    living_street: c('#7CFC00'), track:        c('#8B7355'),
    busway:        c('#FF69B4'), steps:        c('#DDA0DD'),
    unknown:        c('#7b8794'),
  };

  const ROAD_WIDTHS = {
    motorway:5,trunk:5,primary:4,secondary:3.5,tertiary:3,
    residential:2,service:1.5,footway:1.5,path:1.5,
    cycleway:1.5,pedestrian:2,unclassified:2,living_street:2,
    steps:1,busway:2,track:1,unknown:2
  };

  /* ═══════════════════════════════════════════════════════
     Cesium Viewer Setup
     ═══════════════════════════════════════════════════════ */
  const CENTER_LON = 113.878, CENTER_LAT = 22.537;

  const viewer = new Cesium.Viewer('cesiumContainer', {
    imageryProvider: new Cesium.TileMapServiceImageryProvider({
      url: Cesium.buildModuleUrl('Assets/Textures/NaturalEarthII'),
    }),
    baseLayerPicker: false, geocoder: false, homeButton: false,
    sceneModePicker: false, navigationHelpButton: false,
    animation: false, timeline: false, fullscreenButton: false,
    vrButton: false, infoBox: false, selectionIndicator: false,
    shadows: false,
    skyAtmosphere: new Cesium.SkyAtmosphere(),
    skyBox: new Cesium.SkyBox({ show: false }),
    terrainProvider: new Cesium.EllipsoidTerrainProvider(),
  });

  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(CENTER_LON, CENTER_LAT, 6000),
    orientation: { heading: 0, pitch: -0.5, roll: 0 },
    duration: 2,
  });

  /* ═══════════════════════════════════════════════════════
     State
     ═══════════════════════════════════════════════════════ */
  let buildings = [], roads = [];
  let heightMult = 1.0;
  let buildAlpha = 0.96;
  let roadW = 3;
  let showOutline = true;
  let lcTime = 15;
  let clickedLL = null;
  let lcMarker = null, lcCircleEnt = null, lcRouteEnt = null;
  let lcFacilityMarkers = [];
  let buildingEntities = [], roadEntities = [];
  let buildingClickHandler = null;
  let latestMetadata = null;

  /* ═══════════════════════════════════════════════════════
     Terrain Toggle
     ═══════════════════════════════════════════════════════ */
  function setTerrain(type) {
    document.querySelectorAll('.btn-group .ctrl-btn').forEach(function(b) {
      var txt = b.textContent || '';
      if (txt.indexOf('地形') !== -1 || txt.indexOf('平坦') !== -1) {
        b.classList.toggle('active', txt.indexOf(type === 'cesium' ? 'Cesium' : '平坦') !== -1);
      }
    });
    if (type === 'flat') {
      viewer.terrainProvider = new Cesium.EllipsoidTerrainProvider();
      viewer.scene.requestRender();
    } else {
      viewer.terrainProvider = new Cesium.CesiumTerrainProvider({
        url: Cesium.IonResource.fromAssetId(1),
      });
      viewer.terrainProvider.readyPromise.then(function() {
        viewer.scene.requestRender();
      });
    }
  }

  function flyToNS() {
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(CENTER_LON, CENTER_LAT, 4000),
      orientation: { heading: 0, pitch: -0.5, roll: 0 },
      duration: 2,
    });
  }

  /* ═══════════════════════════════════════════════════════
     Load Data
     ═══════════════════════════════════════════════════════ */
  function updateHeaderStats() {
    var buildingsCount = buildings.length.toLocaleString();
    var roadsCount = roads.length.toLocaleString();
    var generatedText = '';
    if (latestMetadata && latestMetadata.generated_at) {
      generatedText = ' | 更新 ' + latestMetadata.generated_at.replace('T', ' ');
    }
    document.getElementById('stats-bar').textContent =
      '建筑 ' + buildingsCount + ' 栋 | 道路 ' + roadsCount + ' 条 | 3D白模' + generatedText;
  }

  function clearSceneEntities() {
    if (buildingClickHandler) {
      buildingClickHandler.destroy();
      buildingClickHandler = null;
    }
    buildingEntities.forEach(function(e) { viewer.entities.remove(e); });
    roadEntities.forEach(function(e) { viewer.entities.remove(e); });
    buildingEntities = [];
    roadEntities = [];
    viewer.scene.requestRender();
  }

  function reloadTwinData(showLoading) {
    var loadingEl = document.getElementById('loading');
    var loadingSub = document.getElementById('loading-sub');
    if (showLoading && loadingEl) loadingEl.classList.remove('hidden');
    if (loadingSub) loadingSub.textContent = '正在加载建筑数据...';

    clearSceneEntities();
    buildings = [];
    roads = [];

    return fetch('./city_twin_metadata.json?ts=' + Date.now())
      .then(function(r) {
        if (!r.ok) throw new Error('metadata ' + r.status);
        return r.json();
      })
      .then(function(meta) {
        latestMetadata = meta;
        return fetch('./buildings_white_model.json?ts=' + Date.now());
      })
      .catch(function() {
        latestMetadata = null;
        return fetch('./buildings_white_model.json?ts=' + Date.now());
      })
      .then(function(r) {
        if (!r.ok) throw new Error('buildings ' + r.status);
        return r.json();
      })
      .then(function(data) {
        buildings = (data.features || []).filter(function(f) {
          return f.geometry && f.geometry.type === 'Polygon';
        });
        if (loadingSub) loadingSub.textContent = '正在加载道路数据...';
        return fetch('./roads_data.json?ts=' + Date.now());
      })
      .then(function(r) {
        if (!r.ok) throw new Error('roads ' + r.status);
        return r.json();
      })
      .then(function(data) {
        roads = (data.features || []).filter(function(f) {
          return f.geometry && f.geometry.type === 'LineString';
        });
        if (loadingSub) loadingSub.textContent = '正在渲染3D场景...';
        renderAll();
        document.getElementById('ind-buildings').textContent = buildings.length.toLocaleString();
        document.getElementById('ind-roads').textContent = roads.length.toLocaleString();
        updateHeaderStats();
        if (showLoading) {
          setTimeout(function() {
            if (loadingEl) loadingEl.classList.add('hidden');
            setTimeout(function() {
              var hint = document.getElementById('camera-hint');
              if (hint) hint.classList.add('hidden');
            }, 4000);
          }, 500);
        }
        return { buildings: buildings.length, roads: roads.length };
      })
      .catch(function(err) {
        console.error(err);
        if (loadingSub) loadingSub.textContent = '加载失败: ' + err.message;
        throw err;
      });
  }

  function loadData() {
    return reloadTwinData(true);
  }

  /* ═══════════════════════════════════════════════════════
     Render All
     ═══════════════════════════════════════════════════════ */
  function renderAll() {
    renderBuildings();
    renderRoads();
    renderLegend();
    viewer.scene.requestRender();
  }

  /* ═══════════════════════════════════════════════════════
     Render Buildings
     ═══════════════════════════════════════════════════════ */
  function renderBuildings() {
    if (buildingClickHandler) {
      buildingClickHandler.destroy();
      buildingClickHandler = null;
    }

    buildingEntities.forEach(function(e) { viewer.entities.remove(e); });
    buildingEntities = [];

    buildings.forEach(function(feat, idx) {
      var props = feat.properties || {};
      var coords = feat.geometry.coordinates && feat.geometry.coordinates[0];
      if (!coords || coords.length < 4) return;

      var useType = Number(props.use_type || 0);
      var baseHeight = Number(props.height_m || 10);
      var hM = Math.max(baseHeight * heightMult, 6);
      var fillColor = Cesium.Color.fromCssColorString('#f3f4f6').withAlpha(buildAlpha);
      var edgeColor = Cesium.Color.fromCssColorString('#4b5563').withAlpha(showOutline ? 0.95 : 0.0);

      var positions;
      try {
        positions = coords.map(function(c) {
          return Cesium.Cartesian3.fromDegrees(Number(c[0]), Number(c[1]), 0);
        });
      } catch (e) {
        return;
      }

      if (positions.length < 4) return;

      try {
        var entity = viewer.entities.add({
          polygon: {
            hierarchy: new Cesium.PolygonHierarchy(positions),
            perPositionHeight: false,
            height: 0,
            extrudedHeight: hM,
            material: fillColor,
            outline: showOutline,
            outlineColor: edgeColor,
            outlineWidth: 1,
            closeTop: true,
            closeBottom: true,
            classificationType: Cesium.ClassificationType.BOTH,
          },
          properties: {
            _featIdx: idx,
            use_type: useType,
            height_m: baseHeight,
          },
        });
        buildingEntities.push(entity);
      } catch (e) {
        // skip malformed geometry
      }
    });

    buildingClickHandler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
    buildingClickHandler.setInputAction(function(click) {
      var picked = viewer.scene.pick(click.position);
      if (Cesium.defined(picked) && picked.id && picked.id.properties) {
        var props = picked.id.properties;
        var featIdx = props._featIdx ? props._featIdx.getValue() : null;
        if (featIdx !== null && buildings[featIdx]) {
          showBuildingInfo(buildings[featIdx].properties || {});
        }
      }
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
  }

  function showBuildingInfo(p) {
    var panel = document.getElementById('info-panel');
    var useName = USE_NAMES_3D[p.use_type] || p.use_name || '\u672a\u77e5';
    var colorHex = '#' + (USE_COLORS[p.use_type] || USE_COLORS[0]).toCssColorString().replace('rgb(', '').replace(/\s/g, '').replace(')', '').split(',').map(function(x) { return parseInt(x).toString(16).padStart(2, '0'); }).join('');
    panel.innerHTML = [
      '<div class="info-card">',
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">',
          '<div style="width:14px;height:14px;border-radius:3px;background:' + colorHex + ';flex-shrink:0;"></div>',
          '<div style="font-size:13px;font-weight:600;color:var(--text-primary);">' + (p.name || useName) + '</div>',
        '</div>',
        '<div class="info-row"><span>\u7528\u9014\u7c7b\u578b</span><span>' + useName + '</span></div>',
        '<div class="info-row"><span>\u697c\u5c42\u6570</span><span>' + (p.floors || 1) + ' \u5c42</span></div>',
        '<div class="info-row"><span>\u4f30\u7b97\u9ad8\u5ea6</span><span>' + (p.height_m ? p.height_m.toFixed(1) : '-') + ' m</span></div>',
        '<div class="info-row"><span>\u5730\u5740</span><span>' + (p.addr || '-') + '</span></div>',
        p.walkability != null ? '<div class="info-row"><span>\u6b65\u884c\u6307\u6570</span><span>' + Number(p.walkability).toFixed(2) + '</span></div>' : '',
      '</div>'
    ].join('');
  }

  /* ═══════════════════════════════════════════════════════
     Render Roads
     ═══════════════════════════════════════════════════════ */
  function renderRoads() {
    roadEntities.forEach(function(e) { viewer.entities.remove(e); });
    roadEntities = [];

    roads.forEach(function(feat) {
      var fclass = feat.properties.fclass || 'unknown';
      var color = ROAD_COLORS[fclass] || ROAD_COLORS.unknown;
      var baseW = ROAD_WIDTHS[fclass] || 2;
      var w = Math.max(baseW * (roadW / 3), 1);

      var coords = feat.geometry.coordinates;
      if (!coords || coords.length < 2) return;

      var positions;
      try {
        positions = coords.map(function(c) { return Cesium.Cartesian3.fromDegrees(c[0], c[1]); });
      } catch(e) { return; }

      if (positions.length < 2) return;

      try {
        var entity = viewer.entities.add({
          polyline: {
            positions: positions,
            width: w,
            material: new Cesium.PolylineGlowMaterialProperty({
              glowPower: 0.1,
              color: color.withAlpha(0.9),
            }),
            clampToGround: true,
          },
        });
        roadEntities.push(entity);
      } catch(e) { /* skip */ }
    });
  }

  /* ═══════════════════════════════════════════════════════
     Render Legend
     ═══════════════════════════════════════════════════════ */
  function renderLegend() {
    // Building legend
    var useTypes = {};
    buildings.forEach(function(f) {
      var ut = f.properties.use_type || 0;
      useTypes[ut] = (useTypes[ut] || 0) + 1;
    });

    var legendUse = document.getElementById('legend-use');
    var html = '';
    Object.keys(useTypes).forEach(function(ut) {
      var n = parseInt(ut);
      var color = USE_COLORS[n] || USE_COLORS[0];
      var hex = '#' + color.toCssColorString().replace('rgb(', '').replace(/\s/g, '').replace(')', '').split(',').map(function(x) { return parseInt(x).toString(16).padStart(2, '0'); }).join('');
      html += '<div class="legend-item"><div class="legend-color" style="background:' + hex + '"></div><span>' + (USE_NAMES_3D[n] || ut) + ' (' + useTypes[ut] + ')</span></div>';
    });
    legendUse.innerHTML = html;

    // Road legend
    var roadTypes = {};
    roads.forEach(function(f) {
      var rc = f.properties.fclass || 'unknown';
      roadTypes[rc] = (roadTypes[rc] || 0) + 1;
    });

    var legendRoads = document.getElementById('legend-roads');
    html = '';
    Object.keys(roadTypes).forEach(function(rt) {
      var color = ROAD_COLORS[rt] || ROAD_COLORS.unknown;
      var hex = '#' + color.toCssColorString().replace('rgb(', '').replace(/\s/g, '').replace(')', '').split(',').map(function(x) { return parseInt(x).toString(16).padStart(2, '0'); }).join('');
      html += '<div class="legend-item"><div class="legend-color" style="background:' + hex + '"></div><span>' + rt + ' (' + roadTypes[rt] + ')</span></div>';
    });
    legendRoads.innerHTML = html;
  }

  /* ═══════════════════════════════════════════════════════
     Layer Toggles
     ═══════════════════════════════════════════════════════ */
  document.getElementById('toggle-buildings').addEventListener('change', function(e) {
    buildingEntities.forEach(function(en) { en.show = e.target.checked; });
    viewer.scene.requestRender();
  });
  document.getElementById('toggle-roads').addEventListener('change', function(e) {
    roadEntities.forEach(function(en) { en.show = e.target.checked; });
    viewer.scene.requestRender();
  });

  /* ═══════════════════════════════════════════════════════
     Sliders
     ═══════════════════════════════════════════════════════ */
  document.getElementById('height-mult').addEventListener('input', function(e) {
    heightMult = parseFloat(e.target.value);
    document.getElementById('height-val').textContent = heightMult.toFixed(1) + 'x';
    renderBuildings();
    viewer.scene.requestRender();
  });
  document.getElementById('alpha-slider').addEventListener('input', function(e) {
    buildAlpha = parseFloat(e.target.value);
    document.getElementById('alpha-val').textContent = buildAlpha.toFixed(2);
    renderBuildings();
    viewer.scene.requestRender();
  });
  document.getElementById('road-width').addEventListener('input', function(e) {
    roadW = parseFloat(e.target.value);
    document.getElementById('road-val').textContent = roadW.toFixed(1);
    renderRoads();
    viewer.scene.requestRender();
  });
  document.getElementById('toggle-wireframe').addEventListener('change', function(e) {
    showOutline = e.target.checked;
    renderBuildings();
    viewer.scene.requestRender();
  });

  /* ═══════════════════════════════════════════════════════
     Map Click Handler
     ═══════════════════════════════════════════════════════ */
  var mapClickHandler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
  mapClickHandler.setInputAction(function(click) {
    var ray = viewer.camera.getPickRay(click.position);
    var cartesian = viewer.scene.globe.pick(ray, viewer.scene);
    if (!cartesian) return;
    var cartographic = Cesium.Cartographic.fromCartesian(cartesian);
    clickedLL = {
      lon: Cesium.Math.toDegrees(cartographic.longitude),
      lat: Cesium.Math.toDegrees(cartographic.latitude),
    };
  }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

  /* ═══════════════════════════════════════════════════════
     15\u5206\u949f\u751f\u6d3b\u5708
     ═══════════════════════════════════════════════════════ */
  function setLCRadius(min) {
    lcTime = min;
    document.querySelectorAll('.lc-time-btns .ctrl-btn-sm').forEach(function(b) { b.classList.remove('active'); });
    var btn = document.getElementById('lc-btn-' + min);
    if (btn) btn.classList.add('active');
  }

  function clearLCCircle() {
    if (lcMarker) { viewer.entities.remove(lcMarker); lcMarker = null; }
    if (lcCircleEnt) { viewer.entities.remove(lcCircleEnt); lcCircleEnt = null; }
    if (lcRouteEnt) { viewer.entities.remove(lcRouteEnt); lcRouteEnt = null; }
    lcFacilityMarkers.forEach(function(m) { viewer.entities.remove(m); });
    lcFacilityMarkers = [];
    document.getElementById('lc-result').style.display = 'none';
    document.getElementById('lc-no-point').classList.remove('hidden');
    document.getElementById('lc-loading').classList.add('hidden');
  }

  // POI type to hex color
  var POI_COLORS_3D = {
    '\u5730\u94c1': '#3b82f6',
    'subway': '#3b82f6',
    '\u516c\u4ea4': '#22c55e',
    'bus': '#22c55e',
    '\u9333\u8f6e': '#f59e0b',
    '\u5b66\u6821': '#8b5cf6',
    'school': '#8b5cf6',
    '\u533b\u7597': '#ef4444',
    'hospital': '#ef4444',
    '\u5546\u573a': '#f97316',
    'mall': '#f97316',
    '\u9910\u996e': '#ec4899',
    'restaurant': '#ec4899',
    '\u94f6\u884c': '#64748b',
    'bank': '#64748b',
    '\u516c\u56ed': '#10b981',
    'park': '#10b981',
    // API types from closest-facilities endpoint
    'transit': '#f59e0b',
    'shopping': '#f472b6',
    'life': '#fbbf24',
    'entertainment': '#a78bfa',
    'government': '#64748b',
    'office': '#38bdf8',
    'company': '#60a5fa',
    'hotel': '#f87171',
    'public': '#86efac',
    'other': '#94a3b8',
    'default': '#94a3b8',
  };
  function getPoiColor(type) {
    return POI_COLORS_3D[type] || POI_COLORS_3D.default;
  }

  function analyzeLivingCircle() {
    if (!clickedLL) {
      document.getElementById('lc-no-point').classList.remove('hidden');
      return;
    }
    var lon = clickedLL.lon, lat = clickedLL.lat;

    document.getElementById('lc-loading').classList.remove('hidden');
    document.getElementById('lc-result').style.display = 'none';
    document.getElementById('lc-no-point').classList.add('hidden');

    if (lcMarker) { viewer.entities.remove(lcMarker); lcMarker = null; }
    if (lcCircleEnt) { viewer.entities.remove(lcCircleEnt); lcCircleEnt = null; }

    // Marker
    lcMarker = viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(lon, lat, 5),
      billboard: {
        image: createMarkerCanvas(),
        width: 28, height: 28,
        verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
      },
    });

    // Circle via polygon
    var radiusKm = lcTime * 60 * 4.5 / 1000; // ~4.5km/h
    var areaKm2 = (Math.PI * radiusKm * radiusKm).toFixed(2);
    var steps = 72;
    var circlePos = [];
    for (var i = 0; i <= steps; i++) {
      var angle = (i / steps) * 2 * Math.PI;
      circlePos.push(Cesium.Cartesian3.fromDegrees(
        lon + (radiusKm / 111) * Math.cos(angle),
        lat + (radiusKm / 111) * Math.sin(angle)
      ));
    }
    lcCircleEnt = viewer.entities.add({
      polygon: {
        hierarchy: new Cesium.PolygonHierarchy(circlePos),
        material: Cesium.Color.fromCssColorString('#ff6b35').withAlpha(0.08),
        outline: true,
        outlineColor: Cesium.Color.fromCssColorString('#ff6b35').withAlpha(0.7),
        height: 1,
        perPositionHeight: true,
      },
    });

    // Fly to
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(lon, lat, 3000),
      orientation: { heading: 0, pitch: -0.5, roll: 0 },
      duration: 1.5,
    });

  // Call real walking-network API
    var url = '../api/living-circle?lat=' + lat + '&lon=' + lon + '&time_threshold=' + lcTime;
    fetch(url)
      .then(function(resp) { return resp.json(); })
      .then(function(data) {
        // Render the actual convex-hull polygon from the network
        var polygon = data.polygon || [];
        if (polygon.length >= 3) {
          var polyPos = polygon.map(function(p) {
            return Cesium.Cartesian3.fromDegrees(p[0], p[1], 1);
          });
          if (lcCircleEnt) {
            viewer.entities.remove(lcCircleEnt);
            lcCircleEnt = null;
          }
          lcCircleEnt = viewer.entities.add({
            polygon: {
              hierarchy: new Cesium.PolygonHierarchy(polyPos),
              material: Cesium.Color.fromCssColorString('#ff6b35').withAlpha(0.08),
              outline: true,
              outlineColor: Cesium.Color.fromCssColorString('#ff6b35').withAlpha(0.7),
              height: 1,
              perPositionHeight: true,
            },
          });
        }

        // Render facility POI markers
        var facilities = data.facilities || [];
        facilities.forEach(function(f) {
          var facLon = f.lon || (f.coordinate && f.coordinate[0]);
          var facLat = f.lat || (f.coordinate && f.coordinate[1]);
          if (!facLon || !facLat) return;
          var m = viewer.entities.add({
            position: Cesium.Cartesian3.fromDegrees(facLon, facLat, 3),
            point: {
              pixelSize: 6,
              color: Cesium.Color.fromCssColorString(getPoiColor(f.facility_type || f.type || 'default')).withAlpha(0.9),
              outlineColor: Cesium.Color.WHITE,
              outlineWidth: 1,
            },
            description: '<b>' + (f.name || '\u8bbe\u65bd') + '</b><br>' +
              '\u7c7b\u578b: ' + (f.facility_type || f.type || '\u672a\u77e5') +
              (f.walk_time_s ? '<br>\u6b65\u884c: ' + Math.round(f.walk_time_s / 60) + ' \u5206\u949f' : ''),
          });
          lcFacilityMarkers.push(m);
        });

        document.getElementById('lc-loading').classList.add('hidden');
        document.getElementById('lc-result').style.display = 'block';
        document.getElementById('lc-location-name').textContent = '\u8d77\u70b9 (' + lon.toFixed(5) + ', ' + lat.toFixed(5) + ')';
        document.getElementById('lc-area').textContent = data.area_km2 ? data.area_km2.toFixed(2) + ' km\u00b2' : '--';
        document.getElementById('lc-transit').textContent = data.transit_count || 0;
        var subwayCount = facilities.filter(function(f) {
          return f.facility_type === '\u5730\u94c1' || f.facility_type === 'subway';
        }).length;
        document.getElementById('lc-subway').textContent = subwayCount || '--';

        var facDiv = document.getElementById('lc-facilities');
        if (facilities.length === 0) {
          facDiv.innerHTML = '<div style="font-size:11px;color:var(--text-muted);text-align:center;padding:8px;">\u8303\u56f4\u5185\u672a\u627e\u5230\u8bbe\u65bd</div>';
        } else {
          var counts = {};
          facilities.forEach(function(f) {
            var t = f.facility_type || '\u5176\u4ed6';
            counts[t] = (counts[t] || 0) + 1;
          });
          var items = Object.keys(counts).slice(0, 15).map(function(ut) {
            return '<div class="facility-item">' +
              '<span class="facility-name" style="display:flex;align-items:center;gap:6px;">' +
                '<span style="width:10px;height:10px;border-radius:2px;background:' +
                getPoiColor(ut) + ';flex-shrink:0;"></span>' + ut +
              '</span>' +
              '<span class="facility-time">' + counts[ut] + '\u680b</span>' +
            '</div>';
          });
          facDiv.innerHTML = items.join('');
        }
      })
      .catch(function(err) {
        document.getElementById('lc-loading').classList.add('hidden');
        document.getElementById('lc-result').style.display = 'block';
        document.getElementById('lc-location-name').textContent = '\u8d77\u70b9 (' + lon.toFixed(5) + ', ' + lat.toFixed(5) + ')';
        document.getElementById('lc-area').textContent = '--';
        document.getElementById('lc-transit').textContent = '--';
        document.getElementById('lc-subway').textContent = '--';
        document.getElementById('lc-facilities').innerHTML = '<div style="font-size:11px;color:#f87171;text-align:center;padding:8px;">API\u8bf7\u6c42\u5931\u8d25: ' + err.message + '</div>';
      });
  }

  function haversine(lon1, lat1, lon2, lat2) {
    var R = 6371000;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function createMarkerCanvas() {
    var canvas = document.createElement('canvas');
    canvas.width = 28; canvas.height = 28;
    var ctx = canvas.getContext('2d');
    ctx.beginPath();
    ctx.arc(14, 14, 12, 0, Math.PI * 2);
    ctx.fillStyle = '#ff6b35';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(14, 14, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    return canvas;
  }

  /* ═══════════════════════════════════════════════════════
     Address Search
     ═══════════════════════════════════════════════════════ */
  var lcSearchTimeout = null;
  var searchInput = document.getElementById('lc-search');
  if (searchInput) {
    searchInput.addEventListener('input', function() {
      clearTimeout(lcSearchTimeout);
      var q = this.value.trim();
      if (q.length < 2) {
        document.getElementById('lc-search-results').style.display = 'none';
        return;
      }
      lcSearchTimeout = setTimeout(function() { doSearch(q); }, 400);
    });
    searchInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') lcSearchLocation();
    });
  }

  function lcSearchLocation() {
    var q = document.getElementById('lc-search').value.trim();
    if (!q) return;
    doSearch(q);
  }

  function doSearch(query) {
    var resultsDiv = document.getElementById('lc-search-results');
    resultsDiv.style.display = 'block';
    resultsDiv.innerHTML = '<div style="padding:8px;font-size:11px;color:var(--text-muted);">\u641c\u7d22\u4e2d...</div>';
    fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(query + ', \u6df1\u5733, \u5357\u5c71\u533a') + '&limit=5', {
      headers: { 'Accept': 'application/json' }
    }).then(function(r) { return r.json(); })
      .then(function(data) {
        if (!data || data.length === 0) {
          resultsDiv.innerHTML = '<div style="padding:8px;font-size:11px;color:var(--text-muted);">\u65e0\u7ed3\u679c</div>';
          return;
        }
        resultsDiv.innerHTML = data.map(function(item) {
          return '<div class="search-result-item" onclick="selectSearchResult(' + item.lat + ',' + item.lon + ',\'' + (item.display_name || '').replace(/'/g, "\\'") + '\')">' +
            '<div class="sr-name">' + (item.display_name || '').split(',')[0] + '</div>' +
            '<div class="sr-sub">' + (item.display_name || '').split(',').slice(1, 3).join(',') + '</div>' +
          '</div>';
        }).join('');
      })
      .catch(function() {
        resultsDiv.innerHTML = '<div style="padding:8px;font-size:11px;color:#f87171;">\u641c\u7d22\u5931\u8d25</div>';
      });
  }

  function selectSearchResult(lat, lon, name) {
    document.getElementById('lc-search-results').style.display = 'none';
    document.getElementById('lc-search').value = (name || '').split(',')[0];
    clickedLL = { lon: parseFloat(lon), lat: parseFloat(lat) };
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(parseFloat(lon), parseFloat(lat), 2000),
      orientation: { heading: 0, pitch: -0.5, roll: 0 },
      duration: 2,
    });
    setTimeout(analyzeLivingCircle, 2500);
  }

  /* ═══════════════════════════════════════════════════════
     Keyboard Shortcuts
     ═══════════════════════════════════════════════════════ */
  document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === '1') flyToNS();
    if (e.key === 'r' || e.key === 'R' || e.key === 'Escape') clearLCCircle();
  });

  /* ═══════════════════════════════════════════════════════
     Init
     ═══════════════════════════════════════════════════════ */
  loadData();

})();
</script>

</html>
